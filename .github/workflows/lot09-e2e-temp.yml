name: Lot 09 Temporary E2E

on:
  push:
    branches: [lot-client-09-rewards-chests]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://wrhxadcagjmhlrebgdma.supabase.co
      SUPABASE_KEY: sb_publishable_XLLKR6SAhFT2j3TeX11e1w_z12Rc7cF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run authenticated Lot 09 E2E
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false }
          });

          const { data: authData, error: authError } = await supabase.auth.signInAnonymously({
            options: { data: { test_mode: true, test_suite: 'lot09-e2e' } }
          });
          if (authError || !authData.session || !authData.user) {
            console.error('E2E_BLOCKED_AUTH', authError?.message ?? 'anonymous sign-in unavailable');
            process.exit(2);
          }
          console.log(`TEST_USER_ID=${authData.user.id}`);
          console.log(`AUTH_OK is_anonymous=${authData.user.is_anonymous}`);

          function groups(board, width) {
            const seen = new Set();
            const out = [];
            const inside = (r,c) => r >= 0 && c >= 0 && r < width && c < width;
            for (let i = 1; i <= board.length; i++) {
              if (seen.has(i) || board[i-1] == null || board[i-1] < 0) continue;
              const color = board[i-1];
              const q = [i], group = [i]; seen.add(i);
              while (q.length) {
                const x = q.shift(), r = Math.floor((x-1)/width), c = (x-1)%width;
                for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
                  const nr=r+dr,nc=c+dc;
                  if (!inside(nr,nc)) continue;
                  const y=nr*width+nc+1;
                  if (!seen.has(y) && board[y-1] === color) { seen.add(y); q.push(y); group.push(y); }
                }
              }
              if (group.length >= 2) out.push(group);
            }
            return out.sort((a,b)=>b.length-a.length);
          }

          async function playLevel(levelId, maxMoves) {
            const start = await supabase.functions.invoke('game-v2', { body: { action: 'start', level_id: levelId } });
            if (start.error) throw new Error(`LEVEL_${levelId}_START:${start.error.message}`);
            let state = start.data;
            console.log(`LEVEL_${levelId}_START session=${state.session_id}`);
            for (let attempt = 0; attempt < maxMoves; attempt++) {
              if (state.result === 'WIN') return state;
              if (state.result === 'FAIL') throw new Error(`LEVEL_${levelId}_FAILED`);
              const board = state.board_state;
              const candidates = groups(board, 6);
              if (!candidates.length) throw new Error(`LEVEL_${levelId}_NO_VALID_GROUP`);
              const cell = candidates[0][0];
              const move = await supabase.functions.invoke('game-v2', {
                body: { action: 'move', session_id: state.session_id, action_type: 'clear_group', action_payload: { cell }, expected_move_number: state.move_number + 1 }
              });
              if (move.error) throw new Error(`LEVEL_${levelId}_MOVE:${move.error.message}`);
              state = move.data;
              if (state.result === 'WIN') {
                console.log(`LEVEL_${levelId}_WIN moves=${state.move_number}`);
                return state;
              }
            }
            throw new Error(`LEVEL_${levelId}_NO_WIN`);
          }

          const moveLimits = {1:28,2:28,3:28,4:28,5:28,6:28,7:28,8:27,9:27,10:26};
          for (let level = 1; level <= 10; level++) await playLevel(level, moveLimits[level]);

          const chestList = await supabase.functions.invoke('rewards-v1', { body: { action: 'available_chest' } });
          if (chestList.error) throw new Error(`CHEST_LIST:${chestList.error.message}`);
          const chest = (chestList.data?.chests ?? []).find(c => c.chest_code === 'basic_chest');
          if (!chest) throw new Error('CHEST_ENTITLEMENT_NOT_FOUND');
          console.log(`CHEST_AVAILABLE id=${chest.id} claim_key=${chest.claim_key}`);

          const opened = await supabase.functions.invoke('rewards-v1', {
            body: { action: 'open_chest', chest_code: chest.chest_code, claim_key: chest.claim_key }
          });
          if (opened.error) throw new Error(`CHEST_OPEN:${opened.error.message}`);
          console.log(`CHEST_OPEN_OK ${JSON.stringify(opened.data)}`);

          const duplicate = await supabase.functions.invoke('rewards-v1', {
            body: { action: 'open_chest', chest_code: chest.chest_code, claim_key: chest.claim_key }
          });
          console.log(`CHEST_SECOND_CALL ${JSON.stringify(duplicate.data ?? { error: duplicate.error?.message })}`);
          if (!duplicate.error && duplicate.data?.duplicate !== true) {
            throw new Error('IDEMPOTENCE_CONTRACT_UNEXPECTED');
          }
          console.log('LOT09_E2E_PASS');
          NODE